[project]
name = "harel_claims"
version = "0.1.0"
description = "Harel claims analytics — job task code"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
generate_sample_data = "harel_claims.sample_data:main"
quality_gates = "harel_claims.quality_gates:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pyspark>=4.0,<4.1",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harel_claims"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests import the pipeline's claims_logic module directly.
pythonpath = ["src", "src/claims_etl"]

[tool.ruff]
line-length = 110
# Pipeline source files use the `spark` global injected by the runtime.
extend-exclude = ["src/claims_etl/transformations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DTZ"]

[tool.ruff.lint.isort]
known-first-party = ["harel_claims", "claims_logic"]
