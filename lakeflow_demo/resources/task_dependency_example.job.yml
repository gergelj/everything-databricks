resources:
  jobs:
    task_dependency_example:
      name: task_dependency_example
      email_notifications:
        on_failure:
          - gergelj.kis@databricks.com
        no_alert_for_skipped_runs: true
      notification_settings:
        no_alert_for_skipped_runs: true
        no_alert_for_canceled_runs: true
      tasks:
        - task_key: first_task
          notebook_task:
            notebook_path: ../src/hello_world.ipynb
            source: WORKSPACE
        - task_key: check_duplicates
          depends_on:
            - task_key: first_task
          condition_task:
            op: EQUAL_TO
            left: "{{job.parameters.if}}"
            right: "true"
        - task_key: remove_duplicates
          depends_on:
            - task_key: check_duplicates
              outcome: "true"
          notebook_task:
            notebook_path: ../src/hello_world.ipynb
            source: WORKSPACE
        - task_key: second_task
          depends_on:
            - task_key: remove_duplicates
            - task_key: check_duplicates
              outcome: "false"
          run_if: NONE_FAILED
          notebook_task:
            notebook_path: ../src/hello_world.ipynb
            source: WORKSPACE
      queue:
        enabled: true
      parameters:
        - name: if
          default: "true"
      performance_target: PERFORMANCE_OPTIMIZED
