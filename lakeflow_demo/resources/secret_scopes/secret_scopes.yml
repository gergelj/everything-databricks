resources:
  secret_scopes:
    my_secret_scope:
      name: prod-secrets-scope
      permissions:
        - level: READ
          group_name: users
        - level: MANAGE
          group_name: admins

# Add secret values in a separate CD pipeline with:
# databricks secrets put-secret <scope_name> <secret_key> --string-value <secret_value/env variable>

# You should not store secret values in any asset bundle files or CI/CD pipelines directly.