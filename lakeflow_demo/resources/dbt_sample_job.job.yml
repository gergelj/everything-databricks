resources:
  jobs:
    dbt_sample_job:
      name: dbt_sample_job
      tasks:
        - task_key: dbt_seed_task
          dbt_task:
            project_directory: ${workspace.root_path}/dbt_project
            commands:
              - dbt seed
          job_cluster_key: dbt_cluster
          libraries:
            - pypi:
                package: dbt-databricks

        - task_key: dbt_build_task
          depends_on:
            - task_key: dbt_seed_task
          dbt_task:
            project_directory: ${workspace.root_path}/dbt_project
            commands:
              - dbt deps
              - dbt build
          job_cluster_key: dbt_cluster
          libraries:
            - pypi:
                package: dbt-databricks

        - task_key: dbt_test_task
          depends_on:
            - task_key: dbt_build_task
          dbt_task:
            project_directory: ${workspace.root_path}/dbt_project
            commands:
              - dbt test
          job_cluster_key: dbt_cluster
          libraries:
            - pypi:
                package: dbt-databricks

      job_clusters:
        - job_cluster_key: dbt_cluster
          new_cluster:
            spark_version: 16.4.x-scala2.12
            azure_attributes:
              availability: SPOT_WITH_FALLBACK_AZURE
              spot_bid_max_price: 100
            node_type_id: Standard_DS3_v2
            data_security_mode: SINGLE_USER
            runtime_engine: STANDARD
            kind: CLASSIC_PREVIEW
            is_single_node: false
            num_workers: 2
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED

