resources:
  jobs:
    my_wheel_job:
      name: my_wheel_job
      tasks:
        - task_key: python_wheel_task
          python_wheel_task:
            package_name: hello_wheel
            entry_point: main
          job_cluster_key: New_job_cluster
          libraries:
            - whl: ${var.wheel_package_path}/hello_wheel-0.0.1-py3-none-any.whl
              
        - task_key: python_script_task
          spark_python_task:
            python_file: ../src/sample.py
          job_cluster_key: New_job_cluster
          libraries:
            - whl: ${var.wheel_package_path}/hello_wheel-0.0.1-py3-none-any.whl
      
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      job_clusters:
        - job_cluster_key: New_job_cluster
          new_cluster:
            spark_version: 16.4.x-scala2.12
            azure_attributes:
              availability: SPOT_WITH_FALLBACK_AZURE
              spot_bid_max_price: 100
            node_type_id: Standard_DS3_v2
            spark_env_vars:
              PYSPARK_PYTHON: /databricks/python3/bin/python3
            data_security_mode: SINGLE_USER
            runtime_engine: STANDARD
            kind: CLASSIC_PREVIEW
            is_single_node: false
            num_workers: 4