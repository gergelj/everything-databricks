# This is a Databricks asset bundle definition for lakeflow_demo.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: lakeflow_demo
  uuid: a1e7553a-dca8-4f8e-8167-311409dee811

artifacts:
  hello_wheel:
    type: whl
    build: python3 setup.py bdist_wheel

include:
  - resources/*.yml
  - resources/*/*.yml
  - tests/*.yml

python:
  resources:
    - 'resources.python_jobs:load_resources'

variables:
  wheel_package_path:
    default: ""
    description: Path to the Python wheel package
  warehouse_id:
    default: ${resources.sql_warehouses.dbt_sql_warehouse.id}
    description: SQL Warehouse ID for running dbt
  catalog:
    default: dev_catalog
  schema:
    default: dev_schema
  #your-service-principal:
  #  default: ""
  #  description: service principal ID

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405605863279072.12.azuredatabricks.net/
    variables:
      wheel_package_path:
        default: ../dist
      catalog:
        default: dev_catalog
      schema:
        default: dev_schema
    resources:
      secret_scopes:
        my_secret_scope:
          name: dev-secrets-scope

  test:
    mode: production
    presets:
      name_prefix: '[TEST]'
    workspace:
      host: https://adb-7405605863279072.12.azuredatabricks.net/
      root_path: /Workspace/Users/gergelj.kis@databricks.com/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: gergelj.kis@databricks.com
        level: CAN_MANAGE

  prod:
    mode: production
    git:
      branch: lakeflow-demo # deployment should be done from this branch
    
    workspace:
      host: https://adb-7405605863279072.12.azuredatabricks.net/
      # We explicitly deploy to /Workspace/Users/gergelj.kis@databricks.com to make sure we only have a single copy.
      root_path: /Workspace/Users/gergelj.kis@databricks.com/.bundle/${bundle.name}/${bundle.target}
      artifact_path: /Volumes/demo/landing/data/package
    variables:
      wheel_package_path:
        default: ${workspace.artifact_path}/.internal
      catalog:
        default: prod_catalog
      schema:
        default: prod_schema
      #your-service-principal:
      #  lookup:
      #    service_principal: <SERVICE_PRINCIPAL_NAME>
    #permissions:
    #  - group_name: engineers
    #    level: CAN_VIEW
    #  - service_principal_name: ${var.your-service-principal}
    #    level: CAN_MANAGE
    #run_as:
    #  service_principal_name: 557c9a9d-570e-43ca-8876-c76b35f464fa
