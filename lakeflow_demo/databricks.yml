# This is a Databricks asset bundle definition for lakeflow_demo.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: lakeflow_demo
  uuid: a1e7553a-dca8-4f8e-8167-311409dee811

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

include:
  - resources/*.yml
  - resources/*/*.yml

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-4501945468888683.3.azuredatabricks.net

  prod:
    mode: production
    workspace:
      host: https://adb-4501945468888683.3.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/gergelj.kis@databricks.com to make sure we only have a single copy.
      root_path: /Workspace/Users/gergelj.kis@databricks.com/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: gergelj.kis@databricks.com
        level: CAN_MANAGE
