anchor_name: &test_job
  resources:
    jobs:
      test:
        name: test

        tasks:
          - task_key: notebook_task
            notebook_task:
              notebook_path: src/test.ipynb
            environment_key: default

        environments:
          - environment_key: default
            spec:
              environment_version: "4"

targets:
  test:
    <<: *test_job